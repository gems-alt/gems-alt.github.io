<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Visitenkarte</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #333; display: flex; min-height: 100vh; }
        .container { display: flex; width: 100%; min-height: 100vh; flex-direction: row; }
        
        /* Linke Seite: Dein hochgeladenes Bild */
        .image-side { 
            flex: 1; 
            background-image: url('Norwaybeauty.jpg'); 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center center; 
            background-color: #ffffff; 
            min-height: 300px;
            padding: 20px;
        }
        
        /* Rechte Seite: Der Inhalt */
        .content-side { 
            flex: 1; 
            display: flex; 
            align-items: flex-start; 
            justify-content: center; 
            padding: 80px 40px 40px 40px; 
            background-color: #ffffff; 
        }
        .inner-content { max-width: 450px; width: 100%; }
        
        /* Überschrift mit erhöhtem Abstand nach unten */
        h1 { font-size: 2.5rem; margin-bottom: 35px; color: #111; font-weight: 600; letter-spacing: -0.5px; }
        p { font-size: 1.05rem; line-height: 1.6; margin-bottom: 35px; color: #555; }
        
        /* Kompakter Button-Bereich nebeneinander */
        .button-group { display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        
        /* Gemeinsame Basis für alle kleinen Buttons */
        .btn-small { 
            display: inline-block; 
            padding: 8px 16px; 
            font-size: 0.85rem;
            font-weight: 500; 
            text-decoration: none; 
            border-radius: 4px; 
            text-align: center;
            transition: background 0.2s, color 0.2s; 
        }

        /* E-Mail Box (Kopierbar) */
        .btn-mail { background-color: #111; color: #fff; cursor: text; }

        /* Messenger Links (Anklickbar) */
        .btn-messenger { background-color: #f4f4f4; color: #333; }
        .btn-messenger:hover { background-color: #eaeaea; }
        .btn-id { font-weight: normal; color: #666; margin-left: 4px; }

        /* Hinweis unter den Buttons */
        .hint { 
            font-size: 0.8rem; 
            color: #999; 
            margin-top: 5px; 
            font-style: italic; 
        }

        /* Smartphone-Optimierung */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .image-side { min-height: 350px; }
            .content-side { padding: 40px 20px; }
            h1 { font-size: 2rem; margin-bottom: 25px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Linke Spalte (Bild) -->
        <div class="image-side"></div>
        
        <!-- Rechte Spalte (Text) -->
        <div class="content-side">
            <div class="inner-content">
                <h1>Willkommen</h1>
                <p>Hier kommt dein persönlicher Freitext hin, den du dir gerade in deinem Dokument zusammenstellst. Sobald du den Text fertig hast, kannst du diesen Absatz einfach durch deine Zeilen ersetzen.</p>
                
                <div class="button-group">
                    <!-- E-Mail (Anzeige zum Kopieren) -->
                    <span class="btn-small btn-mail">gems26@proton.me</span>
                    
                    <!-- Telegram (Direkt-Chat-Link) -->
                    <a href="https://t.me" target="_blank" class="btn-small btn-messenger">Telegram<span class="btn-id">@gems261</span></a>
                    
                    <!-- Signal (Direkt-Chat-Link) -->
                    <a href="https://signal.me" target="_blank" class="btn-small btn-messenger">Signal<span class="btn-id">Gems.05</span></a>
                </div>

                <!-- Zusatzhinweis -->
                <div class="hint">Weitere Messenger auf Anfrage</div>
            </div>
        </div>
    </div>

</body>
</html>
