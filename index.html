<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Visitenkarte</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #333; display: flex; min-height: 100vh; }
        .container { display: flex; width: 100%; min-height: 100vh; flex-direction: row; }
        
        /* Linke Seite: Dein hochgeladenes Bild */
        .image-side { 
            flex: 1; 
            background-image: url('Norwaybeauty.jpg'); 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center center; 
            background-color: #ffffff; 
            min-height: 300px;
            padding: 20px;
        }
        
        /* Rechte Seite: Der Inhalt */
        .content-side { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 40px; 
            background-color: #ffffff; 
        }
        .inner-content { max-width: 450px; width: 100%; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #111; font-weight: 600; letter-spacing: -0.5px; }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; color: #666; }
        
        /* Button-Bereich */
        .button-group { display: flex; flex-direction: column; gap: 10px; }
        
        /* Haupt-Button (E-Mail) */
        .btn { 
            display: inline-block; 
            padding: 14px 30px; 
            background-color: #111; 
            color: #fff; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: 500; 
            text-align: center;
            transition: background 0.2s; 
        }
        .btn:hover { background-color: #333; }

        /* Messenger-Buttons */
        .btn-messenger { 
            display: inline-block; 
            padding: 10px 20px; 
            background-color: #f4f4f4; 
            color: #333; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: 500; 
            text-align: center;
            font-size: 0.95rem;
            transition: background 0.2s; 
        }
        .btn-messenger:hover { background-color: #eaeaea; }
        .btn-id { font-size: 0.8rem; display: block; color: #777; font-weight: normal; margin-top: 2px; }

        /* Hinweis unter den Buttons */
        .hint { 
            text-align: center; 
            font-size: 0.85rem; 
            color: #999; 
            margin-top: 15px; 
            font-style: italic; 
        }

        /* Smartphone-Optimierung */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .image-side { min-height: 350px; }
            .content-side { padding: 30px 20px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Linke Spalte (Bild) -->
        <div class="image-side"></div>
        
        <!-- Rechte Spalte (Text) -->
        <div class="content-side">
            <div class="inner-content">
                <h1>Willkommen</h1>
                <p>Hier kommt dein persönlicher Freitext hin, den du dir noch in Ruhe überlegst. Du kannst hier beschreiben, wer du bist, was du machst oder wie man dich am besten erreicht.</p>
                
                <div class="button-group">
                    <!-- E-Mail-Adresse -->
                    <a href="mailto:gems26@proton.me" class="btn">E-Mail schreiben</a>
                    
                    <!-- Gefilterte Messenger Buttons -->
                    <a href="https://t.me" target="_blank" class="btn-messenger">Telegram <span class="btn-id">@gems261</span></a>
                    <a href="https://signal.me" target="_blank" class="btn-messenger">Signal <span class="btn-id">Gems.05</span></a>
                    <a href="https://sessionapp.link" target="_blank" class="btn-messenger">Session <span class="btn-id">ID kopieren</span></a>
                </div>

                <!-- Dein gewünschter Zusatzhinweis -->
                <div class="hint">Weitere Messenger auf Anfrage</div>
            </div>
        </div>
    </div>

</body>
</html>
